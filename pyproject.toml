[project]
name = "deep-context-platform"
version = "0.1.0"
description = "Deep Context Platform: Hybrid RAG, Typed Memory, and Recursive Language Model (RLM) Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "google-genai>=0.1.0",
    "onnxruntime>=1.29.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.23.0",
    "nltk>=3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
]

[project.scripts]
deep-context = "deep_context.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_context"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["rag eval", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "onnxruntime.*"]
ignore_missing_imports = true
